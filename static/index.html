<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Chat & Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<script>
  // Applied before first paint (and before app.js loads) to avoid a
  // flash of the wrong theme: saved choice wins, otherwise fall back to
  // the OS/browser preference.
  (function () {
    var saved = localStorage.getItem("cg_theme");
    var theme = saved === "light" || saved === "dark"
      ? saved
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="screen">
  <form id="login-form" class="login-card">
    <div class="wordmark wordmark--full" role="img" aria-label="Chat & Games">
      <span class="wordmark-text">
        <span class="wordmark-word wordmark-word--a">Chat</span>
        <svg class="wordmark-glyph" viewBox="0 0 22 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect class="wg-bubble" x="1" y="1" width="20" height="13" rx="6.5"/>
          <path class="wg-bubble" d="M6 14 L6 19 L11 14 Z"/>
          <circle class="wg-pip" cx="7" cy="6.2" r="1.4"/>
          <circle class="wg-pip" cx="11" cy="7.7" r="1.4"/>
          <circle class="wg-pip" cx="15" cy="9.6" r="1.4"/>
        </svg>
        <span class="wordmark-word wordmark-word--b">Games</span>
      </span>
      <svg class="wordmark-swoosh" viewBox="0 0 200 24" preserveAspectRatio="none" fill="none" aria-hidden="true">
        <path d="M4,17 C 60,3 140,3 196,15" stroke="url(#wm-grad-full)" stroke-width="3" stroke-linecap="round"/>
        <defs>
          <linearGradient id="wm-grad-full" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" style="stop-color: var(--accent)"/>
            <stop offset="1" style="stop-color: var(--accent-strong)"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <p class="login-sub">Chatten. Spielen. Spaß haben.</p>
    <label>Zugangscode</label>
    <input type="password" id="login-code" placeholder="Passwort" autocomplete="off" required />
    <label>Dein Name</label>
    <input type="text" id="login-name" placeholder="z.B. Tim" maxlength="32" autocomplete="off" required />
    <button type="submit">Los geht's 🚀</button>
    <p id="login-error" class="login-error" hidden></p>
  </form>
</div>

<!-- APP SHELL -->
<div id="app" class="screen" hidden>
  <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Menü">☰</button>

  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="wordmark wordmark--compact" role="img" aria-label="Chat & Games">
        <span class="wordmark-text">
          <span class="wordmark-word wordmark-word--a">Chat</span>
          <svg class="wordmark-glyph" viewBox="0 0 22 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect class="wg-bubble" x="1" y="1" width="20" height="13" rx="6.5"/>
            <path class="wg-bubble" d="M6 14 L6 19 L11 14 Z"/>
            <circle class="wg-pip" cx="7" cy="6.2" r="1.4"/>
            <circle class="wg-pip" cx="11" cy="7.7" r="1.4"/>
            <circle class="wg-pip" cx="15" cy="9.6" r="1.4"/>
          </svg>
          <span class="wordmark-word wordmark-word--b">Games</span>
        </span>
        <svg class="wordmark-swoosh" viewBox="0 0 200 24" preserveAspectRatio="none" fill="none" aria-hidden="true">
          <path d="M4,17 C 60,3 140,3 196,15" stroke="url(#wm-grad-compact)" stroke-width="3" stroke-linecap="round"/>
          <defs>
            <linearGradient id="wm-grad-compact" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0" style="stop-color: var(--accent)"/>
              <stop offset="1" style="stop-color: var(--accent-strong)"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" title="Theme wechseln" aria-label="Theme wechseln">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-section sidebar-section-channels">
      <div class="sidebar-title">Kanäle</div>
      <ul id="channel-list" class="channel-list"></ul>
      <form id="new-channel-form" class="new-channel-form">
        <input id="new-channel-input" type="text" placeholder="neuer-kanal" maxlength="32" />
        <button type="submit">+</button>
      </form>
    </div>

    <div class="sidebar-section sidebar-section-games">
      <div class="sidebar-title">🎮 Spiele</div>
      <ul id="game-type-list" class="game-type-list"></ul>
      <ul id="game-lobby-list" class="game-lobby-list"></ul>
    </div>

    <div class="sidebar-section sidebar-section-online">
      <div class="sidebar-title">Online</div>
      <ul id="online-list" class="online-list"></ul>
    </div>

    <p class="ephemeral-hint">ℹ️ Nachrichtenverlauf kann bei Inaktivität zurückgesetzt werden</p>
    <div class="sidebar-me" id="sidebar-me"></div>
  </aside>

  <main class="main">
    <header class="chat-header">
      <span id="current-channel-name">#</span>
    </header>

    <div id="messages" class="messages"></div>

    <div id="poll-composer" class="poll-composer" hidden>
      <div class="poll-composer-head">
        <strong>Neue Umfrage</strong>
        <button type="button" id="poll-close-btn" class="icon-btn">✕</button>
      </div>
      <input id="poll-question" type="text" placeholder="Frage..." maxlength="300" />
      <div id="poll-options"></div>
      <button type="button" id="poll-add-option" class="ghost-btn">+ Option</button>
      <button type="button" id="poll-submit" class="primary-btn">Umfrage posten</button>
    </div>

    <form id="message-form" class="message-form">
      <button type="button" id="snap-btn" class="icon-btn" title="Snap aufnehmen">📸</button>
      <button type="button" id="attach-btn" class="icon-btn" title="Bild senden">📷</button>
      <button type="button" id="poll-btn" class="icon-btn" title="Umfrage erstellen">📊</button>
      <input id="message-input" type="text" placeholder="Nachricht schreiben..." autocomplete="off" maxlength="4000" />
      <button type="submit" id="send-btn" class="send-btn">Senden</button>
      <input type="file" id="file-input" accept="image/png,image/jpeg,image/gif,image/webp" hidden />
    </form>
  </main>
</div>

<!-- SNAP MODAL -->
<div id="snap-modal" class="modal-overlay" hidden>
  <div class="modal snap-modal">
    <div class="modal-head">
      <h2>📸 Snap</h2>
      <button type="button" id="snap-close-btn" class="icon-btn">✕</button>
    </div>
    <div class="snap-stage">
      <video id="snap-video" autoplay playsinline muted></video>
      <img id="snap-preview-img" hidden alt="Snap-Vorschau" />
    </div>
    <canvas id="snap-canvas" hidden></canvas>
    <p id="snap-error" class="snap-error" hidden></p>
    <div class="snap-actions">
      <button type="button" id="snap-capture-btn" class="primary-btn">📸 Aufnehmen</button>
      <button type="button" id="snap-retake-btn" class="ghost-btn" hidden>↺ Verwerfen</button>
      <button type="button" id="snap-send-btn" class="primary-btn" hidden>Senden 🚀</button>
    </div>
  </div>
</div>

<!-- GAME MODAL -->
<div id="game-modal" class="modal-overlay" hidden>
  <div class="modal game-modal">
    <div class="modal-head">
      <h2 id="game-modal-title">🎮 Spiel</h2>
      <button type="button" id="game-close-btn" class="icon-btn" title="Spiel verlassen" aria-label="Spiel verlassen">✕</button>
    </div>

    <div class="game-main">
      <div class="game-content">
        <div id="game-stage" class="game-stage"></div>
        <div id="game-overlay-msg" class="game-overlay-msg" hidden>
          <div id="game-overlay-text" class="game-overlay-text"></div>
          <div id="game-overlay-ranking" class="game-overlay-ranking" hidden></div>
          <div class="game-overlay-actions">
            <button type="button" id="game-rematch-btn" class="primary-btn" hidden>🔁 Nochmal spielen</button>
            <button type="button" id="game-overlay-close-btn" class="ghost-btn">Schließen</button>
          </div>
        </div>
      </div>

      <aside id="game-chat-panel" class="game-chat-panel">
        <div class="game-chat-header">
          <span class="game-chat-title">💬 Chat</span>
          <span id="game-chat-channel-name" class="game-chat-channel-name"></span>
          <button type="button" id="game-chat-close-btn" class="icon-btn game-chat-close-btn" title="Chat schließen" aria-label="Chat schließen">✕</button>
        </div>
        <div id="game-chat-messages" class="messages game-chat-messages"></div>
        <form id="game-chat-form" class="message-form game-chat-form">
          <input id="game-chat-input" type="text" placeholder="Nachricht schreiben..." autocomplete="off" maxlength="4000" />
          <button type="submit" class="send-btn">Senden</button>
        </form>
      </aside>
    </div>

    <button type="button" id="game-chat-toggle" class="game-chat-toggle" title="Chat öffnen" aria-label="Chat öffnen">
      💬 Chat <span id="game-chat-badge" class="game-chat-badge" hidden>0</span>
    </button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/games/timliner.js"></script>
<script src="/app.js"></script>
</body>
</html>
